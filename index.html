<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Gym Tracker Ultimate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:#0b0b0b;color:#fff}
header{display:flex;justify-content:space-around;padding:12px;background:#000;position:sticky;top:0;z-index:9}
header button{background:none;border:none;color:#777;font-size:13px}
header button.active{color:#00ffd5;border-bottom:2px solid #00ffd5}
section{display:none;padding:14px}
section.active{display:block}
.card{background:#1a1a1a;padding:12px;border-radius:14px;margin-bottom:12px}
h2{color:#00ffd5;margin-top:0}
.exercise{display:flex;justify-content:space-between;align-items:center;background:#222;padding:10px;border-radius:10px;margin-bottom:6px}
.exercise.done{background:#103d35}
.controls{display:flex;gap:10px}
.check,.dot{width:18px;height:18px;border-radius:50%;cursor:pointer}
.check{border:2px solid #00ffd5}
.check.active{background:#00ffd5}
.dot{background:#00ffd5}
input,textarea,select{width:100%;margin-top:8px;background:#111;border:1px solid #444;color:#fff;padding:8px;border-radius:8px}
button.save{margin-top:10px;width:100%;background:#00ffd5;border:none;padding:10px;font-weight:bold;border-radius:10px}
.glow img{width:100%;border-radius:10px}
.stat{font-size:14px;margin:4px 0}
.timer{font-size:32px;text-align:center;margin:10px 0}
</style>
</head>

<body>

<header>
<button class="active" onclick="tab('home',this)">Home</button>
<button onclick="tab('workout',this)">Workout</button>
<button onclick="tab('history',this)">Cronologia</button>
<button onclick="tab('glow',this)">Glowup</button>
<button onclick="tab('settings',this)">Extra</button>
</header>

<section id="home" class="active"></section>
<section id="workout"></section>
<section id="history"></section>
<section id="glow"></section>
<section id="settings"></section>

<div class="modal" id="modal" style="display:none"></div>

<script>
// === DATA ===
const days={
"Lunedì – PUSH A":["Chest press","Panca inclinata manubri","Croci macchina/cavi","Shoulder press macchina","Alzate laterali","Push down"],
"Martedì – PULL A":["Lat machine avanti","Rematore macchina","Pulley","Curl manubri alternato","Curl cavo"],
"Mercoledì – LEGS + CORE A":["Squat","Leg press","Leg curl","Calf raise","Crunch","Plank"],
"Giovedì – PUSH B":["Panca piana manubri","Chest press inclinata","Dip assistite","Arnold press","Alzate laterali","Estensioni tricipiti sopra testa"],
"Venerdì – PULL B":["Lat machine presa neutra","Rematore manubrio","Pullover cavo","Curl EZ","Curl concentrato"],
"Sabato – LEGS + CORE B":["Stacco rumeno","Affondi camminati","Leg extension","Calf raise","Leg raise","Plank laterale"]
};

const store=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const load=k=>JSON.parse(localStorage.getItem(k)||"{}");

// === NAV ===
function tab(id,b){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.querySelectorAll("header button").forEach(x=>x.classList.remove("active"));
document.getElementById(id).classList.add("active");b.classList.add("active");
if(id==="home")home();
if(id==="workout")workout();
if(id==="history")history();
if(id==="glow")glow();
if(id==="settings")settings();
}

// === HOME ===
function home(){
const notes=load("notes"),gl=load("glow"),done=load("done");
document.getElementById("home").innerHTML=`
<div class="card">
<h2>📊 Dashboard</h2>
<div class="stat">Esercizi completati oggi: ${Object.values(done).filter(v=>v).length}</div>
<div class="stat">Note totali: ${Object.keys(notes).length}</div>
<div class="stat">Foto Glowup: ${Object.keys(gl).length}</div>
</div>
<div class="card">
<h2>⏱️ Timer Recupero</h2>
<select onchange="startTimer(this.value)">
<option>30</option><option>60</option><option>90</option>
</select>
<div class="timer" id="timer">00</div>
</div>`;
}

// === TIMER ===
let tInt;
function startTimer(s){
clearInterval(tInt);
let t=s;
document.getElementById("timer").innerText=t;
tInt=setInterval(()=>{
t--;
document.getElementById("timer").innerText=t;
if(t<=0){clearInterval(tInt);alert("RECUPERO FINITO");}
},1000);
}

// === WORKOUT ===
function workout(){
const d=load("done");
const w=document.getElementById("workout");
w.innerHTML="";
for(let day in days){
w.innerHTML+=`<div class="card"><h2>${day}</h2></div>`;
const c=w.lastChild;
days[day].forEach(e=>{
c.innerHTML+=`
<div class="exercise ${d[e]?'done':''}">
<span>${e}</span>
<div class="controls">
<div class="check ${d[e]?'active':''}" onclick="doneToggle('${e}',this)"></div>
<div class="dot" onclick="note('${e}')"></div>
</div>
</div>`;
});
}
}

function doneToggle(e,el){
const d=load("done");d[e]=!d[e];store("done",d);
el.classList.toggle("active");el.closest(".exercise").classList.toggle("done");
}

// === NOTE ===
function note(e){
const txt=prompt("Nota esercizio:");
if(!txt)return;
const n=load("notes");
if(!n[e])n[e]=[];
n[e].push({date:new Date().toLocaleDateString(),text:txt});
store("notes",n);
}

// === HISTORY ===
function history(){
const n=load("notes");
const h=document.getElementById("history");
h.innerHTML="";
for(let e in n){
h.innerHTML+=`<div class="card"><b>${e}</b><br>${n[e].map(x=>x.date+" – "+x.text).join("<hr>")}</div>`;
}
}

// === GLOWUP ===
function glow(){
const g=document.getElementById("glow");
g.innerHTML=`
<div class="card">
<h2>Glowup</h2>
<input type="file" accept="image/*" onchange="addGlow(event)">
</div>
<div id="glowList"></div>`;
const gl=load("glow");
for(let k in gl)renderGlow(gl[k]);
}

function addGlow(e){
const r=new FileReader();
r.onload=()=>{
const t=prompt("Miglioramento:");
const gl=load("glow");
const id=Date.now();
gl[id]={img:r.result,text:t,date:new Date().toLocaleDateString()};
store("glow",gl);renderGlow(gl[id]);
};
r.readAsDataURL(e.target.files[0]);
}

function renderGlow(i){
document.getElementById("glowList").innerHTML+=`
<div class="card glow"><img src="${i.img}"><p>${i.text}</p><small>${i.date}</small></div>`;
}

// === SETTINGS ===
function settings(){
document.getElementById("settings").innerHTML=`
<div class="card">
<h2>⚙️ Dati</h2>
<button class="save" onclick="exportData()">Export</button>
<button class="save" onclick="resetAll()">Reset Totale</button>
</div>`;
}

function exportData(){
const data={notes:load("notes"),done:load("done"),glow:load("glow")};
prompt("Copia dati:",JSON.stringify(data));
}

function resetAll(){
if(confirm("Reset totale?")){localStorage.clear();location.reload();}
}

home();
</script>
</body>
</html>
